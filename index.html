<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dyeing Direction Card</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#eceff3; --surface:#ffffff; --ink:#1a2233; --muted:#596378; --line:#d2d8e1;
  --field:#f6f8fb; --accent:#2a3a8c; --accent-ink:#ffffff; --accent-soft:#e1e6f7;
  --ok:#1b7a4b; --warn:#9a5b00; --bad:#b3261e; --bad-soft:#fbe9e7; --warn-soft:#fff3dc;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151e; --surface:#1a2030; --ink:#e5e9f1; --muted:#9aa3b6; --line:#2c3448;
  --field:#141a28; --accent:#93a0f2; --accent-ink:#10142b; --accent-soft:#252d57;
  --ok:#5fd09a; --warn:#f0b35c; --bad:#ff8f86; --bad-soft:#3a1f1f; --warn-soft:#3a2d14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151e; --surface:#1a2030; --ink:#e5e9f1; --muted:#9aa3b6; --line:#2c3448;
  --field:#141a28; --accent:#93a0f2; --accent-ink:#10142b; --accent-soft:#252d57;
  --ok:#5fd09a; --warn:#f0b35c; --bad:#ff8f86; --bad-soft:#3a1f1f; --warn-soft:#3a2d14; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);
  padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-size:24px;letter-spacing:-.01em}
.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:4px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:5px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.danger.sure{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.lnk{border:0;background:none;color:var(--accent);cursor:pointer;padding:2px 0;font-weight:500}

.banner{padding:9px 12px;border-radius:5px;margin-bottom:12px;background:var(--warn-soft);color:var(--warn);border:1px solid currentColor}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner button{margin-left:8px}

/* Archive */
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bar .grow{flex:1 1 320px;min-width:0}
.in,.f input,.f select,.f textarea,.rt input,.rt select,.mt input,.mt select{
  width:100%;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:6px 8px;color:var(--ink)}
.in{padding:9px 12px;font-size:15px}
.in:focus,.f input:focus,.f textarea:focus,.rt input:focus,.rt select:focus{border-color:var(--accent)}
.meta{color:var(--muted);margin:0 0 8px;font-size:13px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lh,.row{display:grid;grid-template-columns:minmax(115px,1fr) minmax(105px,1fr) minmax(0,1.8fr) 98px 80px 64px minmax(0,1fr) 114px;gap:10px;align-items:center;padding:10px 14px}
.lh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line);font-weight:500}
.row{border-bottom:1px solid var(--line);cursor:pointer}
.row:last-of-type{border-bottom:0}
.row:hover{background:var(--accent-soft)}
.row > *{min-width:0;overflow-wrap:anywhere}
.row .pro{font-family:var(--mono);font-weight:500;font-size:14px}
.row .pro a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--accent)}
.row small{display:block;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.badge{display:inline-block;font:500 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:3px 5px;border-radius:3px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:12px var(--mono);background:var(--accent-soft);color:var(--ink);padding:2px 6px;border-radius:3px}
.peek{padding:4px 14px 14px;border-bottom:1px solid var(--line);background:var(--field);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 32px}
.peek h4{margin:10px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.peek ul{list-style:none;margin:0;padding:0}
.peek li{display:flex;justify-content:space-between;gap:12px;padding:2px 0;border-bottom:1px dotted var(--line)}
.peek li span:last-child{font-family:var(--mono);white-space:nowrap}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* Card editor */
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0 10px}
.tb .sp{flex:1}
.status{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.status[data-s="pending"]::before,.status[data-s="saving"]::before{background:var(--warn)}
.status[data-s="error"]{color:var(--bad)} .status[data-s="error"]::before{background:var(--bad)}
.status[data-s="new"]::before{background:var(--line)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 22px}
.sheet-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:6px}
.sheet-h h2{font-size:20px}
.sheet-h span{font-size:12px;color:var(--muted)}
.sec{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 36px}
.col{min-width:0}
.f{display:grid;grid-template-columns:132px minmax(0,1fr);gap:8px;align-items:center;padding:3px 0}
.f.top{align-items:start}
.f label{color:var(--muted);font-size:13px}
.f textarea{resize:vertical;min-height:112px}
.f .hint{grid-column:2;font-size:12px;margin-top:-2px}
.f .hint.warn{color:var(--warn)}
.f .hint a{color:inherit;font-weight:600}
.ratio{display:flex;align-items:center;gap:8px}
.ratio span{font-family:var(--mono);color:var(--muted);flex:none;white-space:nowrap}
.ro-val{font:500 15px var(--mono);padding:4px 0}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:5px;-webkit-overflow-scrolling:touch}
.rt{border-collapse:collapse;width:100%;min-width:800px}
.rt th{font:500 11px var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:7px 6px;background:var(--field);border-bottom:1px solid var(--line)}
.rt td{padding:2px 3px;border-bottom:1px solid var(--line);vertical-align:middle}
.rt tr:last-child td{border-bottom:0}
.rt input,.rt select{border-color:transparent;background:transparent;padding:6px 6px}
.rt input:hover,.rt select:hover{border-color:var(--line)}
.rt .mono,.rt .amt{font-family:var(--mono)}
.c-step{width:62px}.c-code{width:104px}.c-ratio{width:88px}.c-unit{width:84px}.c-amt{width:128px;text-align:right;padding-right:10px!important}
.c-feed{width:90px}.c-act{width:130px}.c-del{width:34px}
.nm{display:block;padding:0 6px;font-size:13px}
.nm-in.bad{color:var(--bad)}
.amt small{color:var(--muted);margin-left:4px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 8px;border-radius:4px}
.x:hover{color:var(--bad);background:var(--bad-soft)}
.unit-tag{font:500 11px var(--mono);background:var(--accent-soft);padding:2px 6px;border-radius:3px;letter-spacing:0}
.add{margin-top:6px}
.sign{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;margin-top:18px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.print-only{display:none}

/* Master */
.mt{width:100%;border-collapse:collapse}
.mt th{font:500 11px var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
.mt td{padding:6px 12px;border-bottom:1px solid var(--line)}
.mt td.code{font-family:var(--mono);width:120px}
.mt td.acts{text-align:right;white-space:nowrap;width:130px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.addrow{display:grid;grid-template-columns:130px minmax(0,1fr) 140px auto;gap:8px;padding:12px;background:var(--field);border-bottom:1px solid var(--line)}
.prog{padding:10px 12px;border-radius:5px;background:var(--accent-soft);margin-bottom:12px}

/* Desktop Floating Autocomplete */
.ac-menu{
  position:fixed;z-index:9999;background:var(--surface);border:1px solid var(--accent);
  border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:240px;overflow-y:auto;
  -webkit-overflow-scrolling:touch;min-width:240px
}
.ac-item{
  padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;
  justify-content:space-between;align-items:center;gap:10px;font-size:14px
}
.ac-item:last-child{border-bottom:0}
.ac-item:hover,.ac-item.active{background:var(--accent-soft)}
.ac-item .ac-code{font-family:var(--mono);font-weight:600;color:var(--accent);white-space:nowrap}
.ac-item .ac-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Mobile Fullscreen Picker Modal (Phone Friendly) */
.mp-backdrop{
  position:fixed;inset:0;z-index:10000;background:rgba(15,20,32,.6);
  display:flex;flex-direction:column;justify-content:flex-start;
  padding-top:env(safe-area-inset-top,0px)
}
.mp-sheet{
  background:var(--surface);width:100%;height:100%;display:flex;flex-direction:column;
  overflow:hidden
}
.mp-head{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-bottom:1px solid var(--line);background:var(--surface);flex:none
}
.mp-head input{
  flex:1;min-width:0;background:var(--field);border:1px solid var(--accent);
  border-radius:6px;padding:10px 12px;font-size:16px;color:var(--ink)
}
.mp-close{
  border:1px solid var(--line);background:var(--field);border-radius:6px;
  padding:9px 12px;font-weight:600;cursor:pointer;white-space:nowrap
}
.mp-tabs{
  display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);
  background:var(--field);flex:none
}
.mp-tabs button{
  flex:1;padding:7px 10px;border-radius:5px;border:1px solid var(--line);
  background:var(--surface);font-weight:500;font-size:13px;cursor:pointer
}
.mp-tabs button[aria-pressed="true"]{
  background:var(--accent);color:var(--accent-ink);border-color:var(--accent)
}
.mp-list{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:40px
}
.mp-item{
  padding:13px 16px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;justify-content:space-between;gap:12px;cursor:pointer;
  active-background:var(--accent-soft)
}
.mp-item:active{background:var(--accent-soft)}
.mp-item .mp-left{min-width:0;flex:1}
.mp-item .mp-nm{font-weight:500;font-size:15px;color:var(--ink);line-height:1.3}
.mp-item .mp-cd{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:600;margin-top:2px}
.mp-item .mp-tag{
  font-size:11px;padding:3px 7px;border-radius:4px;background:var(--accent-soft);
  color:var(--ink);font-weight:500;white-space:nowrap
}
.mp-empty{padding:32px 16px;text-align:center;color:var(--muted);font-size:14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:5px;z-index:10001;max-width:calc(100% - 32px)}

@media (max-width:820px){
  .lh{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:2px 12px}
  .row .num{text-align:left}
  .g2{grid-template-columns:minmax(0,1fr)}
  .addrow{grid-template-columns:minmax(0,1fr)}
  .ac-menu{display:none!important}
}
@media (max-width:520px){
  .f{grid-template-columns:minmax(0,1fr);gap:2px}.f .hint{grid-column:1}
  .sheet{padding:14px}
  input,select,textarea{font-size:16px!important}
  /* Perbesar touch target sel tabel di HP */
  .rt input,.rt select{padding:9px 6px}
  .c-code{width:110px}
  .c-name-col{min-width:190px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media print{
  body{background:#fff;color:#000;padding:0;font-size:11px}
  body::before,.no-print,.ac-menu,.mp-backdrop{display:none!important}
  .wrap{max-width:none}
  .sheet{border:0;padding:0}
  .f input,.f select,.f textarea,.rt input,.rt select{border:0!important;background:none!important;padding:1px 0!important;color:#000!important;appearance:none;-webkit-appearance:none}
  .f textarea{resize:none}
  .tblwrap{overflow:visible;border:1px solid #000}
  .rt{min-width:0}
  .rt th,.rt td{border-color:#999;color:#000;background:none}
  .print-only{display:flex}
  .x{display:none}
}
</style>

<div class="wrap">
  <header class="top no-print">
    <div>
      <div class="eyebrow">PT Gistex · R&amp;D Processing</div>
      <h1>Dyeing Direction Card</h1>
    </div>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px">
      <div id="userBadge" hidden style="font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:5px;display:inline-flex;align-items:center;gap:8px">
        <span>User: <strong id="userNameLabel" style="color:var(--ink)"></strong></span>
        <button type="button" class="lnk" id="btnSwitchUser" style="font-size:12px">Ganti</button>
      </div>
      <nav class="tabs" aria-label="Menu">
        <button type="button" data-tab="arsip">Arsip</button>
        <button type="button" data-tab="kartu">Kartu</button>
        <button type="button" data-tab="master">Master kode</button>
      </nav>
    </div>
  </header>
  <div id="banners" class="no-print"></div>

  <!-- ARSIP -->
  <section id="v-arsip" hidden>
    <div class="bar">
      <input id="q" class="in grow" type="search" placeholder="Cari nomor PRO (mis. 310000), Code Fabric, warna, atau dyestuff / chemical…" autocomplete="off" aria-label="Cari kartu">
      <select id="fMachine" class="in" style="width:auto" aria-label="Filter mesin"><option value="">Semua mesin</option></select>
      <input id="fMonth" class="in" style="width:auto" type="month" aria-label="Filter bulan">
      <button id="btnNew" type="button" class="btn primary needs-write">Kartu baru</button>
      <button id="btnExport" type="button" class="btn" hidden>Unduh rekap Excel</button>
    </div>
    <p id="count" class="meta"></p>
    <div class="list" id="list"></div>
  </section>

  <!-- KARTU -->
  <section id="v-kartu" hidden>
    <div class="tb no-print">
      <button type="button" class="btn" id="btnBack">← Arsip</button>
      <span id="status" class="status" role="status" data-s="new">Kartu baru, belum disimpan</span>
      <span class="sp"></span>
      <button type="button" class="btn primary needs-write" id="btnSave" title="Simpan kartu ke arsip" disabled>Simpan</button>
      <button type="button" class="btn" id="btnPrint" title="Simpan ke arsip lalu buat PDF untuk dicetak">Cetak</button>
      <button type="button" class="btn needs-write" id="btnDup" title="Buat kartu baru dengan resep yang sama">Pakai ulang resep</button>
      <button type="button" class="btn danger needs-write" id="btnDel">Hapus</button>
    </div>
    <div id="remote" class="no-print"></div>
    <div class="sheet" id="sheet">
      <div class="sheet-h"><h2>Dyeing Direction Card</h2><span>PT GISTEX</span></div>

      <div class="sec">Batch dan order</div>
      <div class="g2">
        <div class="col" id="colA"></div>
        <div class="col" id="colB"></div>
      </div>

      <div class="sec">Mesin dan proses</div>
      <div class="g2">
        <div class="col">
          <div class="f"><label for="f-dyeingPattern">Dyeing Pattern</label><input id="f-dyeingPattern" data-k="dyeingPattern"></div>
          <div class="f top"><label for="f-processPattern">Process Pattern</label><textarea id="f-processPattern" data-k="processPattern" rows="5"></textarea></div>
        </div>
        <div class="col">
          <div class="f"><label for="f-mainPump">Main Pump</label><input id="f-mainPump" data-k="mainPump"></div>
          <div class="f"><label for="f-fabricSpeed">Fabric Speed</label><input id="f-fabricSpeed" data-k="fabricSpeed"></div>
          <div class="f"><label for="f-reelTorque">Reel Torque</label><input id="f-reelTorque" data-k="reelTorque"></div>
          <div class="f"><label for="f-customer">Customer</label><input id="f-customer" data-k="customer" data-ac="customer" autocomplete="off"></div>
          <div class="f"><label>Mode Air</label>
            <div class="seg" role="group" aria-label="Mode Water Ratio" style="width:100%">
              <button type="button" id="wm-ratio" data-wm="ratio" aria-pressed="true" style="flex:1;padding:4px 8px;font-size:12px">Auto (1:x × Kg)</button>
              <button type="button" id="wm-liter" data-wm="liter" aria-pressed="false" style="flex:1;padding:4px 8px;font-size:12px">Manual (Isi Liter)</button>
            </div>
          </div>
          <div class="f"><label for="f-ratio">Water Ratio</label><div class="ratio"><span>1 :</span><input id="f-ratio" data-k="ratio" type="number" step="any" inputmode="decimal"></div></div>
          <div class="f"><label for="f-manualL">Amount</label>
            <div class="ro-val" id="amount">–</div>
            <div class="ratio" id="manualLWrap" hidden><input id="f-manualL" data-k="manualL" type="number" step="any" inputmode="decimal" placeholder="mis. 250"><span>L</span></div>
          </div>
        </div>
      </div>

      <div class="sec">Resep</div>
      <div class="g2">
        <div class="f"><label for="f-recipeNo">Recipe No</label><input id="f-recipeNo" data-k="recipeNo"></div>
        <div class="f"><label for="f-recipeName">Recipe Name</label><input id="f-recipeName" data-k="recipeName"></div>
      </div>

      <div class="sec">Dyestuff <span class="unit-tag">% owf</span></div>
      <div class="tblwrap"><table class="rt" id="t-dyes"></table></div>

<script>
(function(){
'use strict';
var DYE_ROWS=11, CHEM_ROWS=15;
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var fmt=function(n,d){return n==null||!isFinite(n)?'':n.toLocaleString('id-ID',{maximumFractionDigits:d==null?2:d})};
var today=function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var normDate=function(s){
  if(!s)return '';
  var str=String(s).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(str))return str.slice(0,10);
  var d=new Date(str);
  if(!isNaN(d)){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  return str;
};
var fmtDate=function(s){
  var iso=normDate(s);
  if(!iso)return '';
  var d=new Date(iso+'T00:00:00');
  return isNaN(d)?iso:d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
};
var newId=function(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var lsGet=function(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
var lsSet=function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
var isMobile=function(){return window.innerWidth<=820};

var COL_A=[['machine','Machine','text','machine'],['pro','Batch No. (PRO)','text'],['batchName','Batch Name','text'],['codeFabric','Code Fabric','text'],['right','Right','text'],['left','Left','text'],['weight','Weight (kg)','number'],['gy','g/y','number'],['pieces','Pieces','number'],['material','Material','text']];
var COL_B=[['date','Date','date'],['orderNo','Order No.','text'],['orderName','Order Name','text'],['colorNo','Color No','text'],['colorName','Color Name','text'],['hue','Hue','text'],['nozzle','Nozzle','text'],['nozzlePrs','Nozzle Prs','text']];
var TEXT_KEYS=['machine','pro','batchName','codeFabric','right','left','weight','gy','pieces','material','date','orderNo','orderName','colorNo','colorName','hue','nozzle','nozzlePrs','dyeingPattern','processPattern','mainPump','fabricSpeed','reelTorque','customer','waterMode','ratio','manualL','recipeNo','recipeName','memo','maker'];

var state={cards:new Map(),chems:new Map(),cur:null,dirty:false,writable:true,local:false,loaded:{cards:false,chems:false},open:new Set(),mg:'all',editCode:null,adding:false,imp:null,view:'',lists:{machine:[],customer:[],maker:[]}};
var DB=null, saveTimer=null, saving=false, again=false;

var GAS_URL = 'https://script.google.com/macros/s/AKfycbxJeiaDyTLnvWJf0J_DmEaz9t54t-Nw0fqqr41oKT2RG0a5omXDZc550d8EqQSA9ZJY/exec';

function getPin(forceAsk){
  var p = sessionStorage.getItem('ddc:pin');
  if (!p || forceAsk) {
    p = prompt('Masukkan PIN Akses (R&D / Produksi):');
    if (p) {
      p = p.trim();
      sessionStorage.setItem('ddc:pin', p);
      sessionStorage.removeItem('ddc:user');
    }
  }
  return p || '';
}

function currentUser(){
  return (sessionStorage.getItem('ddc:user') || lsGet('ddc:maker') || '').trim();
}

function ensureUserName(pin, serverUser, forceAsk){
  if (serverUser) {
    var su = String(serverUser).trim();
    sessionStorage.setItem('ddc:user', su);
    lsSet('ddc:maker', su);
    updateUserBadge();
    return su;
  }
  var u = sessionStorage.getItem('ddc:user');
  if (!u || forceAsk) {
    var byPin = lsGet('ddc:userByPin') || {};
    var defName = u || byPin[pin] || lsGet('ddc:maker') || '';
    var asked = prompt('Masukkan Nama Pembuat (untuk tanda tangan & PDF):', defName);
    if (asked && asked.trim()) {
      u = asked.trim();
      sessionStorage.setItem('ddc:user', u);
      byPin[pin] = u;
      lsSet('ddc:userByPin', byPin);
      lsSet('ddc:maker', u);
    } else if (defName) {
      u = defName;
      sessionStorage.setItem('ddc:user', u);
    }
  }
  updateUserBadge();
  return u || '';
}

function updateUserBadge(){
  var badge = $('#userBadge'), lbl = $('#userNameLabel');
  if (!badge || !lbl) return;
  var u = currentUser();
  if (sessionStorage.getItem('ddc:pin')) {
    badge.hidden = false;
    lbl.textContent = u || '(Belum diisi)';
  } else {
    badge.hidden = true;
  }
}

/* ---------- Mobile Fullscreen Picker (Phone Friendly) ---------- */
var mpModal = $('#mpModal'), mpSearch = $('#mpSearch'), mpTabs = $('#mpTabs'), mpList = $('#mpList');
var mpTarget = null, mpGroup = 'dye', mpItems = [];

function openMobilePicker(el){
  if (!state.writable || el.disabled || el.readOnly) return;
  mpTarget = el;
  var isChem = (el.dataset.f === 'code' || el.dataset.f === 'nameSearch');
  mpTabs.hidden = !isChem;
  if (isChem) {
    mpGroup = (el.dataset.t === 'dyes') ? 'dye' : 'chem';
    $$('[data-mpg]', mpTabs).forEach(function(b){
      b.setAttribute('aria-pressed', String(b.dataset.mpg === mpGroup));
    });
    mpSearch.placeholder = 'Cari kode atau nama ' + (mpGroup === 'dye' ? 'dyestuff' : 'chemical') + '...';
    mpSearch.value = '';
  } else {
    var labelMap = {machine:'Mesin', customer:'Customer', maker:'Nama Pembuat'};
    mpSearch.placeholder = 'Cari atau ketik ' + (labelMap[el.dataset.ac] || '') + '...';
    mpSearch.value = el.value || '';
  }
  renderMobilePicker();
  mpModal.hidden = false;
  setTimeout(function(){ mpSearch.focus(); }, 60);
}

function closeMobilePicker(){
  mpModal.hidden = true;
  mpTarget = null;
  mpItems = [];
}

function renderMobilePicker(){
  if (!mpTarget) return;
  var q = mpSearch.value.trim().toLowerCase();
  var isChem = (mpTarget.dataset.f === 'code' || mpTarget.dataset.f === 'nameSearch');
  if (isChem) {
    var all = Array.from(state.chems.values()).sort(function(a,b){
      return a.name.localeCompare(b.name);
    });
    mpItems = all.filter(function(item){
      if (mpGroup !== 'all' && item.group !== mpGroup) return false;
      if (!q) return true;
      return item.code.toLowerCase().indexOf(q) > -1 || item.name.toLowerCase().indexOf(q) > -1;
    });
    if (!mpItems.length) {
      mpList.innerHTML = '<div class="mp-empty">Tidak ada kode yang cocok.<br><small>Coba ganti kata kunci atau pilih tab "Semua".</small></div>';
      return;
    }
    mpList.innerHTML = mpItems.map(function(it, idx){
      return '<div class="mp-item" data-mpidx="'+idx+'">'+
        '<div class="mp-left">'+
          '<div class="mp-nm">'+esc(it.name)+'</div>'+
          '<div class="mp-cd">'+esc(it.code)+'</div>'+
        '</div>'+
        '<span class="mp-tag">'+(it.group === 'chem' ? 'Chemical' : 'Dyestuff')+'</span>'+
      '</div>';
    }).join('');
  } else {
    var acKey = mpTarget.dataset.ac;
    var rawList = (state.lists[acKey] || []).filter(function(v){
      return !q || v.toLowerCase().indexOf(q) > -1;
    });
    mpItems = rawList.map(function(v){ return { text: v }; });
    var typed = mpSearch.value.trim();
    var extraHtml = '';
    if (typed && !rawList.some(function(v){ return v.toLowerCase() === typed.toLowerCase(); })) {
      mpItems.unshift({ text: typed, custom: true });
    }
    if (!mpItems.length) {
      mpList.innerHTML = '<div class="mp-empty">Ketik teks baru di atas lalu pilih.</div>';
      return;
    }
    mpList.innerHTML = mpItems.map(function(it, idx){
      return '<div class="mp-item" data-mpidx="'+idx+'">'+
        '<div class="mp-left"><div class="mp-nm">'+(it.custom ? 'Pakai: "'+esc(it.text)+'"' : esc(it.text))+'</div></div>'+
      '</div>';
    }).join('');
  }
}

mpSearch.addEventListener('input', renderMobilePicker);
mpTabs.addEventListener('click', function(e){
  var b = e.target.closest('[data-mpg]');
  if (!b) return;
  mpGroup = b.dataset.mpg;
  $$('[data-mpg]', mpTabs).forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
  renderMobilePicker();
});
$('#mpClose').onclick = closeMobilePicker;
mpList.addEventListener('click', function(e){
  var row = e.target.closest('[data-mpidx]');
  if (!row || !mpTarget) return;
  var it = mpItems[+row.dataset.mpidx];
  if (!it) return;
  var el = mpTarget;
  if (it.code) {
    var r = state.cur[el.dataset.t][+el.dataset.i];
    var tr = el.closest('tr');
    r.code = it.code;
    var codeIn = tr.querySelector('[data-f="code"]');
    var nmIn = tr.querySelector('[data-f="nameSearch"]');
    if (codeIn) codeIn.value = it.code;
    if (nmIn) { nmIn.value = it.name; nmIn.className = 'nm-in'; }
    recalc();
    touch();
    closeMobilePicker();
    var ratioIn = tr.querySelector('[data-f="ratio"]');
    if (ratioIn) setTimeout(function(){ ratioIn.focus(); }, 80);
  } else {
    el.value = it.text;
    if (el.dataset.k) {
      state.cur[el.dataset.k] = it.text;
      touch();
    }
    closeMobilePicker();
  }
});

/* ---------- Desktop Floating Autocomplete ---------- */
var acTarget = null, acItems = [], acIndex = -1;
var acMenu = $('#acMenu');

function hideAc(){
  acMenu.hidden = true;
  acTarget = null;
  acItems = [];
  acIndex = -1;
}

function positionAc(el){
  if (!el || acMenu.hidden) return;
  var r = el.getBoundingClientRect();
  var vw = window.innerWidth, vh = window.innerHeight;
  var w = Math.max(r.width, 280);
  if (w > vw - 16) w = vw - 16;
  var left = r.left;
  if (left + w > vw - 8) left = Math.max(8, vw - w - 8);
  acMenu.style.width = w + 'px';
  acMenu.style.left = left + 'px';
  var spaceBelow = vh - r.bottom - 10;
  var spaceAbove = r.top - 10;
  if (spaceBelow < 160 && spaceAbove > spaceBelow) {
    acMenu.style.top = 'auto';
    acMenu.style.bottom = (vh - r.top + 4) + 'px';
    acMenu.style.maxHeight = Math.min(240, spaceAbove) + 'px';
  } else {
    acMenu.style.bottom = 'auto';
    acMenu.style.top = (r.bottom + 4) + 'px';
    acMenu.style.maxHeight = Math.min(240, Math.max(120, spaceBelow)) + 'px';
  }
}

function getAcCandidates(el){
  var q = String(el.value || '').trim().toLowerCase();
  if (el.dataset.f === 'code' || el.dataset.f === 'nameSearch') {
    var prefGroup = el.dataset.t === 'dyes' ? 'dye' : 'chem';
    var all = Array.from(state.chems.values()).sort(function(a,b){
      var ga = a.group === prefGroup ? 0 : 1;
      var gb = b.group === prefGroup ? 0 : 1;
      return ga - gb || a.name.localeCompare(b.name);
    });
    return all.filter(function(item){
      if (!q) return item.group === prefGroup;
      return item.code.toLowerCase().indexOf(q) > -1 || item.name.toLowerCase().indexOf(q) > -1;
    }).slice(0, 40).map(function(item){
      return { code: item.code, name: item.name, group: item.group };
    });
  }
  var acKey = el.dataset.ac;
  if (acKey && state.lists[acKey]) {
    return state.lists[acKey].filter(function(v){
      return !q || v.toLowerCase().indexOf(q) > -1;
    }).slice(0, 30).map(function(v){
      return { text: v };
    });
  }
  return [];
}

function showAc(el){
  if (isMobile()) return;
  if (!state.writable || el.disabled || el.readOnly) return;
  var items = getAcCandidates(el);
  if (!items.length) { hideAc(); return; }
  acTarget = el;
  acItems = items;
  acIndex = -1;
  acMenu.innerHTML = items.map(function(it, idx){
    if (it.code) {
      return '<div class="ac-item" data-acidx="'+idx+'">'+
        '<span class="ac-code">'+esc(it.code)+'</span>'+
        '<span class="ac-name">'+esc(it.name)+'</span>'+
      '</div>';
    }
    return '<div class="ac-item" data-acidx="'+idx+'"><span class="ac-name">'+esc(it.text)+'</span></div>';
  }).join('');
  acMenu.hidden = false;
  positionAc(el);
}

function applyAcSelection(idx){
  var el = acTarget, it = acItems[idx];
  if (!el || !it) return;
  if (it.code) {
    var r = state.cur[el.dataset.t][+el.dataset.i];
    var tr = el.closest('tr');
    r.code = it.code;
    var codeIn = tr.querySelector('[data-f="code"]');
    var nmIn = tr.querySelector('[data-f="nameSearch"]');
    if (codeIn) codeIn.value = it.code;
    if (nmIn) { nmIn.value = it.name; nmIn.className = 'nm-in'; }
    recalc();
    touch();
    var ratioIn = tr.querySelector('[data-f="ratio"]');
    if (ratioIn) ratioIn.focus();
  } else {
    el.value = it.text;
    if (el.dataset.k) {
      state.cur[el.dataset.k] = it.text;
      touch();
    }
  }
  hideAc();
}

acMenu.addEventListener('pointerdown', function(e){
  var item = e.target.closest('[data-acidx]');
  if (!item) return;
  e.preventDefault();
  applyAcSelection(+item.dataset.acidx);
});

document.addEventListener('focusin', function(e){
  var t = e.target;
  if (!t) return;
  if (t.dataset.f === 'code' || t.dataset.f === 'nameSearch' || t.dataset.ac) {
    if (isMobile()) {
      t.blur();
      openMobilePicker(t);
    } else {
      showAc(t);
    }
  }
});

document.addEventListener('focusout', function(e){
  setTimeout(function(){
    if (document.activeElement !== acTarget) hideAc();
  }, 150);
});

window.addEventListener('scroll', function(){ if (acTarget) positionAc(acTarget); }, true);
window.addEventListener('resize', function(){ if (acTarget) positionAc(acTarget); });

/* ---------- store: Google Sheets via Apps Script ---------- */
function persistLocal(){lsSet('ddc:cards',Array.from(state.cards.values()));lsSet('ddc:chems',Array.from(state.chems.values()))}

async function gasPost(body){
  body.pin = getPin();
  var res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  var data = await res.json();
  if (!data.
